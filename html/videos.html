    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- Vídeo em destaque -->
        <!-- Vídeo em destaque -->
        <section class="mb-12">
        
            <!-- Card do vídeo clicável -->
            <a href="https://www.youtube.com/watch?v=tJbzMqJGH4k" target="_blank" rel="noopener noreferrer"

                <!-- Thumbnail do vídeo -->
                <img src="https://img.youtube.com/vi/tJbzMqJGH4k/maxresdefault.jpg" alt="Grand Theft Auto VI: An Extended Look"

                <!-- Overlay escuro -->
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 transition"></div>
        
                <!-- Botão de play -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div

                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-12 h-12 ml-1">
                            <path d="M8 5v14l11-7z" />

                    </div>
                </div>
        
            </a>

            <p class="mt-2 bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
